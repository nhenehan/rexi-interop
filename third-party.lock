# Implementations and data under test, fetched by scripts/fetch-third-party.sh
# into ${REXI_INTEROP_THIRD_PARTY:-${XDG_CACHE_HOME:-~/.cache}/rexi-interop/third_party}
# (never into this working tree). Pins move only through --update NAME.
#
# Each line: <name> <git url or path relative to this repo> <40-char commit> [sparse path]
# A sparse path checks out only that directory (blobs fetched on demand).
#
# exip:          C implementation (libexip for the exip driver; exipd).
# exi-testsuite: W3C EXI test suite; only Nagasena's jar is used.
# rexi:          the Rust implementation (rexi CLI with `rexi bench`).
# jexi:          the Julia implementation (bin/jexi, `jexi bench` with rexi's
#                command line). Needs julia.
# nagasenacs:    Nagasena for .NET, the C# port of OpenEXI (Subversion only, on
#                SourceForge). r1188 is its last change, version 0000.0002.0056.1.
#                drivers/nagasena-cs builds it with the .NET SDK.
# EXIficient 1.0.7 comes from Maven Central (harness/pom.xml).

