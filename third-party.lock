# Implementations and data under test, fetched by scripts/fetch-third-party.sh
# into ${REXI_INTEROP_THIRD_PARTY:-${XDG_CACHE_HOME:-~/.cache}/rexi-interop/third_party}
# (never into this working tree). A pin moves through --update NAME (a commit)
# or by writing a release tag by hand.
#
# Each line: <name> <git url or path relative to this repo> <40-char commit or tag> [sparse path]
# A sparse path checks out only that directory (blobs fetched on demand).
#
# exip:          C implementation (libexip for the exip driver; exipd).
# exi-testsuite: W3C EXI test suite; only Nagasena's jar is used.
# rexi:          the Rust implementation (rexi CLI with `rexi bench`).
# exiformat:     EXIFormat.jl, the Julia implementation (bin/exiformat,
#                `exiformat bench` with rexi's command line). Needs julia.
# nagasenacs:    Nagasena for .NET, the C# port of OpenEXI (Subversion only, on
#                SourceForge). r1188 is its last change, version 0000.0002.0056.1.
#                drivers/nagasena-cs builds it with the .NET SDK.
# EXIficient 1.0.7 comes from Maven Central (harness/pom.xml).

exip https://github.com/nhenehan/exip.git b2870c106f0cc88fd199208f724ce575df150444
exi-testsuite https://github.com/w3c/exi-testsuite.git 23d5f587ba3ec281f1a6a8182c1450cb870b469e candidates/openexi/lib
rexi https://github.com/nhenehan/rexi.git v0.3.1
exiformat https://github.com/nhenehan/EXIFormat.jl.git v0.1.0
nagasenacs svn:https://svn.code.sf.net/p/openexi/code 1188 trunk/nagasenacs
